name: Build and publish Veyra APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug -PveyraBuildNumber=${{ github.run_number }}
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk veyra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-APK-debug
          path: veyra.apk
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" veyra.apk --title "Veyra $TAG" --notes "Versão de testes: bolha flutuante e avisos de atualização. Filtros de vídeo externo ainda não implementados." --target "${{ github.sha }}" --latest
